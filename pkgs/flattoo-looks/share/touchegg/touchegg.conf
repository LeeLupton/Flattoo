<!-- Flattoo touchpad gestures (touchegg). Two fingers scroll as always;
     three fingers move between workspaces and windows, four fingers show
     the desktop. Edit ~/.config/touchegg/touchegg.conf to change. -->
<touchégg>
  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">3E8BFF</property>
    <property name="borderColor">3E8BFF</property>
  </settings>
  <application name="All">
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="CHANGE_DESKTOP"><direction>next</direction><animate>true</animate><animationPosition>auto</animationPosition></action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="CHANGE_DESKTOP"><direction>previous</direction><animate>true</animate><animationPosition>auto</animationPosition></action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="MAXIMIZE_RESTORE_WINDOW"><animate>true</animate></action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="MINIMIZE_WINDOW"><animate>true</animate></action>
    </gesture>
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="SHOW_DESKTOP"><animate>true</animate></action>
    </gesture>
    <gesture type="PINCH" fingers="2" direction="IN">
      <action type="SEND_KEYS"><repeat>true</repeat><keys>Control_L+minus</keys><decreaseKeys>Control_L+plus</decreaseKeys></action>
    </gesture>
    <gesture type="PINCH" fingers="2" direction="OUT">
      <action type="SEND_KEYS"><repeat>true</repeat><keys>Control_L+plus</keys><decreaseKeys>Control_L+minus</decreaseKeys></action>
    </gesture>
  </application>
  <application name="firefox,Firefox,chromium,Chromium">
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS"><repeat>false</repeat><keys>Alt_L+Right</keys></action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS"><repeat>false</repeat><keys>Alt_L+Left</keys></action>
    </gesture>
  </application>
</touchégg>
