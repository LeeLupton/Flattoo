general {
    colors = true
    interval = 5
    color_good = "#8fbf7f"
    color_degraded = "#e0b060"
    color_bad = "#e06060"
}

order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "volume master"
order += "tztime local"

wireless _first_ {
    format_up = "  %essid"
    format_down = "  off"
}
ethernet _first_ {
    format_up = "  wired"
    format_down = ""
}
battery all {
    format = "%status %percentage"
    status_chr = ""
    status_bat = ""
    status_full = ""
    low_threshold = 15
}
volume master {
    format = " %volume"
    format_muted = " muted"
}
tztime local {
    format = "%a %b %-d  %-I:%M %p"
}
