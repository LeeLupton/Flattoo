# Publish: fast-forward the `pages` branch to `main` (or to a chosen ref),
# which makes the pages workflow rebuild and deploy the site. Refuses
# anything that is not a fast-forward, so pages is always an ancestor-exact
# snapshot of main — nothing on the site that is not in main.
name: promote to pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "What to publish (a branch, tag or commit on this repo)"
        default: main
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fast-forward pages
        env:
          REF: ${{ inputs.ref }}
        run: |
          git config user.name "flattoo-bot"
          git config user.email "flattoo-bot@users.noreply.github.com"
          target=$(git rev-parse --verify "origin/$REF" 2>/dev/null || git rev-parse --verify "$REF")
          if git rev-parse --verify origin/pages >/dev/null 2>&1; then
            if ! git merge-base --is-ancestor origin/pages "$target"; then
              echo "::error::pages is not an ancestor of $REF ($target); refusing a non-fast-forward publish"
              exit 1
            fi
          fi
          git push origin "$target:refs/heads/pages"
          echo "pages -> $(git rev-parse --short "$target")"
