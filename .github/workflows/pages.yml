# The website: landing page, Help & How-To wiki, rendered docs. Built with
# `nix build .#site`, served by GitHub Pages. One-time setup in the repo:
# Settings → Pages → Source: "GitHub Actions".
#
# Two branches: `main` is where work lands; `pages` is what the site shows.
# The site is built from the `pages` branch only, so a push to main never
# changes the public site by itself. To publish, fast-forward pages to main:
# Actions → "promote to pages" → Run workflow (or `git push origin main:pages`).
name: pages

on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Pages has to be switched on once, by a repo admin, with the
      # "GitHub Actions" source (Settings → Pages → Build and deployment →
      # Source, or: gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow).
      # The workflow token is not allowed to do that itself (configure-pages'
      # `enablement: true` fails with "Resource not accessible by integration"),
      # so until then this step stops the run here with a clear message
      # instead of the deploy step 404ing.
      - uses: actions/configure-pages@v5
      - run: nix build .#site --print-build-logs
      - run: cp -rL result site-out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
