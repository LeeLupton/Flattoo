# Every push and PR: the laptop config must evaluate and the stencil tools
# must pass their round-trip test. Cheap (minutes), catches typos before the
# laptop ever sees them.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check --no-build
      - run: nix eval --raw .#nixosConfigurations.shop-laptop.config.system.build.toplevel.drvPath
      - run: nix build .#checks.x86_64-linux.stencil-tools --print-build-logs
      - run: nix fmt -- --check $(git ls-files '*.nix')
